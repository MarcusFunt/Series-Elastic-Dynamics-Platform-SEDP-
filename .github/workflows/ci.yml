name: CI

on:
  push:
  pull_request:

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-core.txt
      - run: python -m py_compile software/python/*.py
      - run: python tests/smoke_core.py
